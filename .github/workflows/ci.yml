name: AirlockAI Cross-Platform Verification

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  typescript-core-web-extension:
    name: TypeScript Core Proofs + Web PWA + Chrome Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install workspace dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Type-check @airlock/core
        run: npm run build:core

      - name: Run 16 Vitest tests (11 golden parity + offline NER + 1,000-run fast-check proofs)
        run: npm run test:core

      - name: Build Web PWA (@airlock/web)
        run: npm run build --workspace=@airlock/web

      - name: Build MV3 Chrome Side Panel Extension (@airlock/extension)
        run: npm run build:extension

      - name: Verify Apache 2.0 LICENSE and zero tracked secret files
        run: |
          head -n 3 LICENSE | grep -q "Apache License"
          ! git ls-files | grep -qE "(\.env\.local|google-services\.json|firebase-debug.*\.log)"

  android-kotlin-parity:
    name: Android Kotlin Golden Vector Parity (spec/vectors.json)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run Kotlin JUnit 4 Golden Parity Tests
        working-directory: apps/android
        run: gradle testDebugUnitTest --stacktrace
